<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muestra · Comentarios</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;background:#0A0A0A;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;
  }
  .wrap{
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px;gap:18px;
  }
  video{
    max-width:100%;max-height:88%;
    border-radius:10px;
    box-shadow:0 24px 80px rgba(0,0,0,.6);
    background:#000;
  }
  .label{
    color:rgba(255,255,255,.55);font-size:11px;
    letter-spacing:.32em;text-transform:uppercase;
    text-align:center;font-weight:500;
  }
  .label small{
    display:block;margin-top:6px;
    letter-spacing:.16em;font-size:9.5px;opacity:.6;
  }
  .back{
    position:fixed;top:18px;left:18px;
    color:rgba(255,255,255,.6);font-size:13px;
    text-decoration:none;display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:20px;
    background:rgba(255,255,255,.05);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:color .2s, background .2s;
  }
  .back:hover{color:#fff;background:rgba(255,255,255,.1)}
  .back svg{width:14px;height:14px}
</style>
</head>
<body>
  <a class="back" href="javascript:window.close();void(0)" onclick="if(window.opener){window.close();return false;}history.back();return false;" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Volver
  </a>
  <div class="wrap">
    <video src="assets/comentarios-demo.mp4" controls autoplay playsinline preload="metadata"></video>
    <div class="label">Muestra · Plataforma externa<small>Comentarios automatizados</small></div>
  </div>
</body>
</html>
